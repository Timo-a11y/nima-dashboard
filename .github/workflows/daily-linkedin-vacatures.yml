name: Daily LinkedIn Appointment Setter Vacatures

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scrape LinkedIn and send email
        run: npm run jobs:linkedin
        env:
          LINKEDIN_KEYWORDS: Appointment Setter
          LINKEDIN_LOCATION: ${{ vars.LINKEDIN_LOCATION }}
          LINKEDIN_TIME_RANGE: ${{ vars.LINKEDIN_TIME_RANGE }}
          LINKEDIN_MAX_PAGES: ${{ vars.LINKEDIN_MAX_PAGES }}
          EMAIL_TO: suuz@studiobenedek.nl
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
