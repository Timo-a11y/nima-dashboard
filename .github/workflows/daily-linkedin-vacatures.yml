name: Daily LinkedIn Marketing Vacatures

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - cursor/marketing-vacatures-rapportage-8406

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scrape LinkedIn and send email
        run: npm run jobs:linkedin
        env:
          LINKEDIN_KEYWORDS: Interim Marketing,Freelance Marketing,Marketing Manager,Campaign Manager,Paid Media Manager,Pl Marketing
          LINKEDIN_LOCATION: Nederland
          LINKEDIN_GEO_ID: 102890719
          LINKEDIN_TIME_RANGE: r864000
          LINKEDIN_MAX_PAGES: ${{ vars.LINKEDIN_MAX_PAGES }}
          LINKEDIN_INCLUDE_POSTS: "true"
          LINKEDIN_POST_SEARCH_PHRASE: ik zoek
          LINKEDIN_POST_MAX_PER_KEYWORD: "8"
          EMAIL_TO: tvanzolingen@gmail.com,a.sarhatlic@gmail.com
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
